spring.application.name=sfqry
spring.profiles.active=mock
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Salesforce Integration User (real profile)
sf.username=${SF_USERNAME:}
sf.password=${SF_PASSWORD:}
sf.security-token=${SF_SECURITY_TOKEN:}
sf.login-url=${SF_LOGIN_URL:https://login.salesforce.com}
sf.api-version=${SF_API_VERSION:65.0}
sf.query-batch-size=${SF_QUERY_BATCH_SIZE:}
